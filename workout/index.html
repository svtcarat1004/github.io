<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>100일 운동 도장판</title>
<meta name="description" content="스쿼트 · 푸시업 · 크런치를 매일 하나씩 늘려가는 100일 도장판">
<meta name="theme-color" content="#fff6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동 도장판">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root {
    --bg: #fff6ec;
    --card: #ffffff;
    --ink: #5a4636;
    --ink-soft: #a08b7a;
    --line: #f1e2d3;
    --accent: #ff9f8a;
    --accent-soft: #ffe3da;
    --star: #ffc94a;
    --star-edge: #f2a922;
    --sun: #ef7a7a;
    --sat: #6f9be0;
    --today: #ffd8a8;
    --stamped-bg: #fff8df;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a2420;
      --card: #362e29;
      --ink: #f5e9de;
      --ink-soft: #b8a596;
      --line: #4a3f38;
      --accent: #ff9f8a;
      --accent-soft: #4d3830;
      --star: #ffc94a;
      --star-edge: #e09a1a;
      --sun: #ff9a9a;
      --sat: #92b6f0;
      --today: #6b4f33;
      --stamped-bg: #463b26;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a2420;
    --card: #362e29;
    --ink: #f5e9de;
    --ink-soft: #b8a596;
    --line: #4a3f38;
    --accent: #ff9f8a;
    --accent-soft: #4d3830;
    --star: #ffc94a;
    --star-edge: #e09a1a;
    --sun: #ff9a9a;
    --sat: #92b6f0;
    --today: #6b4f33;
    --stamped-bg: #463b26;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Gowun Dodum", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 18px; }
  h1 {
    font-family: "Jua", sans-serif;
    font-weight: 400;
    font-size: 28px;
    margin: 4px 0 6px;
    letter-spacing: -0.5px;
  }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .moves { display: flex; justify-content: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 13px;
  }

  .today {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 22px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .today-info { flex: 1; min-width: 0; }
  .today-label { font-size: 13px; color: var(--ink-soft); }
  .today-count { font-family: "Jua", sans-serif; font-size: 26px; margin: 2px 0; }
  .today-count small { font-size: 15px; color: var(--ink-soft); }
  .today-list { font-size: 13px; color: var(--ink-soft); }
  .today-btn {
    flex: none;
    width: 74px; height: 74px;
    border-radius: 50%;
    border: 2.5px dashed var(--accent);
    background: var(--accent-soft);
    color: var(--ink);
    font-family: "Jua", sans-serif;
    font-size: 15px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .15s;
  }
  .today-btn:active { transform: scale(.94); }
  .today-btn.done { border-style: solid; border-color: var(--star-edge); background: var(--stamped-bg); }
  .today-btn svg { width: 46px; height: 46px; }

  .progress { margin-bottom: 16px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .progress-top b { font-family: "Jua", sans-serif; font-weight: 400; font-size: 16px; }
  .bar { height: 12px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--star)); border-radius: 999px; transition: width .4s; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1.22;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 6px 4px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    color: var(--ink);
    font: inherit;
    overflow: hidden;
    transition: transform .12s;
  }
  .cell:active { transform: scale(.95); }
  .cell.is-today { border: 2.5px solid var(--accent); background: var(--accent-soft); }
  .cell.stamped { background: var(--stamped-bg); }
  .cell.future { opacity: .78; }
  .date { font-size: 12px; line-height: 1.2; text-align: center; white-space: nowrap; }
  .date .dow { font-size: 11px; color: var(--ink-soft); }
  .cell.sun .dow { color: var(--sun); }
  .cell.sat .dow { color: var(--sat); }
  .reps {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-family: "Jua", sans-serif;
    font-size: 16px;
    line-height: 1;
  }
  .reps .r { display: flex; align-items: baseline; gap: 3px; white-space: nowrap; }
  .reps em {
    font-family: "Gowun Dodum", sans-serif;
    font-style: normal;
    font-size: 9.5px;
    color: var(--ink-soft);
  }
  .day-no { font-size: 9.5px; color: var(--ink-soft); }

  .stamp {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .stamp svg {
    width: 78%;
    height: 78%;
    transform: rotate(-12deg);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.08));
  }
  .stamp.pop svg { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop {
    0% { transform: scale(1.8) rotate(-30deg); opacity: 0; }
    100% { transform: scale(1) rotate(-12deg); opacity: 1; }
  }
  .cell.stamped .reps, .cell.stamped .day-no { opacity: .55; }

  .month {
    grid-column: 1 / -1;
    font-family: "Jua", sans-serif;
    font-size: 16px;
    margin: 10px 2px 0;
    color: var(--ink-soft);
  }
  .month:first-child { margin-top: 0; }

  footer { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 22px; line-height: 1.6; }
  footer button {
    background: none; border: 1.5px solid var(--line); color: var(--ink-soft);
    border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; margin-top: 6px;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 360px) {
    .grid { gap: 6px; }
    .reps { font-size: 14px; }
    .date { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="font-size:34px">🏋️‍♀️</div>
    <h1>100일 운동 도장판</h1>
    <p class="sub">스쿼트·크런치는 매일 +1, 푸시업은 3일마다 +1</p>
    <div class="moves">
      <span class="chip">① 스쿼트</span>
      <span class="chip">② 푸시업</span>
      <span class="chip">③ 크런치</span>
    </div>
  </header>

  <section class="today" id="today"></section>

  <section class="progress">
    <div class="progress-top"><span>모은 도장</span><span><b id="count">0</b> / 100</span></div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <section class="grid" id="grid"></section>

  <footer>
    칸을 터치하면 ⭐ 도장이 찍히고, 다시 터치하면 지워져요.<br>
    기록은 이 기기의 브라우저에 저장돼요.<br>
    <button type="button" id="jump">오늘 칸으로 이동</button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var START = new Date(2026, 9, 16); // 2026-10-16
  var DAYS = 100;
  var BASE = 10;
  // 스쿼트·크런치는 매일 1개씩, 푸시업은 3일마다 1개씩 늘어남
  function daily(i) { return BASE + i; }
  function pushup(i) { return BASE + Math.floor(i / 3); }
  var KEY = 'workout100-stamps-20261016';
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var CHEERS = ['오늘도 해냈어요! 🎉', '멋져요 💪', '한 칸 더 가까워졌어요 ✨', '꾸준함이 최고예요 🌱', '수고했어요 ☕'];

  var STAR = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L62 36 L94 38 L69 58 L77 90 L50 72 L23 90 L31 58 L6 38 L38 36 Z" fill="var(--star)" stroke="var(--star-edge)" stroke-width="5" stroke-linejoin="round"/><circle cx="40" cy="50" r="3.6" fill="var(--ink)"/><circle cx="60" cy="50" r="3.6" fill="var(--ink)"/><path d="M43 59 Q50 65 57 59" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="33" cy="58" r="3.5" fill="#ff9f8a" opacity=".6"/><circle cx="67" cy="58" r="3.5" fill="#ff9f8a" opacity=".6"/></svg>';

  var stamps = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(stamps)); } catch (e) {}
  }
  function has(i) { return stamps.indexOf(i) !== -1; }

  function dateOf(i) { return new Date(START.getFullYear(), START.getMonth(), START.getDate() + i); }
  function todayIndex() {
    var now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((t - START) / 86400000);
  }

  var grid = document.getElementById('grid');
  var cells = [];

  function build() {
    var ti = todayIndex();
    var lastMonth = -1;
    for (var i = 0; i < DAYS; i++) {
      var d = dateOf(i);
      if (d.getMonth() !== lastMonth) {
        lastMonth = d.getMonth();
        var m = document.createElement('div');
        m.className = 'month';
        m.textContent = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
        grid.appendChild(m);
      }
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'cell';
      var dw = d.getDay();
      if (dw === 0) c.classList.add('sun');
      if (dw === 6) c.classList.add('sat');
      if (i === ti) c.classList.add('is-today');
      if (i > ti) c.classList.add('future');
      c.setAttribute('aria-label', (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DOW[dw] + '요일, 스쿼트·크런치 ' + daily(i) + '개, 푸시업 ' + pushup(i) + '개');
      c.innerHTML =
        '<span class="date">' + (d.getMonth() + 1) + '/' + d.getDate() + ' <span class="dow">' + DOW[dw] + '</span></span>' +
        '<span class="reps"><span class="r"><em>스·크</em>' + daily(i) + '</span><span class="r"><em>푸시업</em>' + pushup(i) + '</span></span>' +
        '<span class="day-no">DAY ' + (i + 1) + '</span>' +
        '<span class="stamp"></span>';
      c.addEventListener('click', toggle.bind(null, i));
      grid.appendChild(c);
      cells.push(c);
    }
  }

  function paintCell(i, animate) {
    var c = cells[i];
    var s = c.querySelector('.stamp');
    if (has(i)) {
      c.classList.add('stamped');
      s.innerHTML = STAR;
      s.classList.toggle('pop', !!animate);
    } else {
      c.classList.remove('stamped');
      s.innerHTML = '';
      s.classList.remove('pop');
    }
  }

  function paintSummary() {
    var n = stamps.length;
    document.getElementById('count').textContent = n;
    document.getElementById('bar').style.width = n + '%';

    var ti = todayIndex();
    var box = document.getElementById('today');
    if (ti < 0) {
      box.innerHTML = '<div class="today-info"><div class="today-label">곧 시작해요</div><div class="today-count">D-' + (-ti) + '</div><div class="today-list">10월 16일부터 각 10개로 시작!</div></div>';
      return;
    }
    if (ti >= DAYS) {
      box.innerHTML = '<div class="today-info"><div class="today-label">100일 챌린지 완료</div><div class="today-count">⭐ ' + n + '개 <small>도장</small></div><div class="today-list">정말 수고 많았어요!</div></div>';
      return;
    }
    var reps = daily(ti), push = pushup(ti);
    var done = has(ti);
    box.innerHTML =
      '<div class="today-info">' +
        '<div class="today-label">오늘은 DAY ' + (ti + 1) + '</div>' +
        '<div class="today-count"><small>스쿼트·크런치</small> ' + reps + ' <small>푸시업</small> ' + push + '</div>' +
        '<div class="today-list">' + (ti % 3 === 2 ? '내일부터 푸시업 +1 💪' : '푸시업은 ' + (3 - ti % 3) + '일 뒤에 +1') + '</div>' +
      '</div>' +
      '<button type="button" class="today-btn' + (done ? ' done' : '') + '" id="todayBtn" aria-label="오늘 도장 찍기">' +
        (done ? STAR : '도장<br>쾅!') +
      '</button>';
    document.getElementById('todayBtn').addEventListener('click', function () { toggle(ti); });
  }

  function toggle(i) {
    var pos = stamps.indexOf(i);
    if (pos === -1) {
      stamps.push(i);
      toast(i === todayIndex() ? CHEERS[Math.floor(Math.random() * CHEERS.length)] : 'DAY ' + (i + 1) + ' 도장 꾹 ⭐');
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
    } else {
      stamps.splice(pos, 1);
      toast('DAY ' + (i + 1) + ' 도장을 지웠어요');
    }
    save();
    paintCell(i, pos === -1);
    paintSummary();
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1500);
  }

  function jumpToToday() {
    var ti = todayIndex();
    if (ti >= 0 && ti < DAYS) cells[ti].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  document.getElementById('jump').addEventListener('click', jumpToToday);

  build();
  for (var i = 0; i < DAYS; i++) paintCell(i, false);
  paintSummary();
})();
</script>
</body>
</html>
